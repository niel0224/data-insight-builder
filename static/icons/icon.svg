<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2c" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="8"/>

  <!-- Grid subtle line -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="#27354c" stroke-width="4" stroke-dasharray="6,6" />

  <!-- Bar 1 -->
  <rect x="110" y="270" width="60" height="110" rx="12" fill="#6366f1" />
  
  <!-- Bar 2 -->
  <rect x="200" y="200" width="60" height="180" rx="12" fill="#818cf8" />

  <!-- Bar 3 -->
  <rect x="290" y="130" width="60" height="250" rx="12" fill="url(#barGrad)" />

  <!-- Trend Line -->
  <path d="M 140 250 L 230 180 L 320 110" fill="none" stroke="url(#lineGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Indicator Dots -->
  <circle cx="140" cy="250" r="10" fill="#38bdf8" />
  <circle cx="230" cy="180" r="10" fill="#818cf8" />
  <circle cx="320" cy="110" r="12" fill="#f43f5e" />

  <!-- Sparkle Star -->
  <polygon points="400,100 408,125 433,133 408,141 400,166 392,141 367,133 392,125" fill="#fbbf24" filter="url(#glow)" />
</svg>
